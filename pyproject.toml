[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "touchless-pc-control"
version = "1.1.0"
description = "Touchless PC Control via Computer Vision and Hand Gestures"
readme = "README.md"
authors = [
    { name = "Praveen", email = "praveennethsith06@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["computer-vision", "hand-tracking", "mediapipe", "opencv", "virtual-mouse", "touchless-control"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Video :: Display",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
]
dependencies = [
    "opencv-python>=4.8.0",
    "mediapipe>=1.0.0",
    "pyautogui>=0.9.54",
    "numpy>=1.24.0",
    "pycaw>=20230407",
    "comtypes>=1.2.0",
    "screen-brightness-control>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "flake8>=6.0.0",
    "black>=23.0.0",
]

[project.scripts]
touchless-control = "VirtualMouse:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]
